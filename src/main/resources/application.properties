spring.application.name=java-login-fingerprint
server.port=8080

# Fingerprint API keys. Leave both blank to run with the stub service, which
# simulates device signals so the app works end to end with no account.
# Real keys come from the Fingerprint dashboard after the kick-off call.
# TODO: confirm the real public/secret keys and the data region with Fingerprint.
fingerprint.public-key=${FINGERPRINT_PUBLIC_KEY:}
fingerprint.secret-key=${FINGERPRINT_SECRET_KEY:}
